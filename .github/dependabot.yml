version: 2
updates:
  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval: "weekly"
  # Locked dependencies of the publish workflow, see release/Gemfile
  - package-ecosystem: "bundler"
    directory: "/release"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: /
    schedule:
      interval: "weekly"
