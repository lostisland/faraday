<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/x-icon" href="_media/favicon.png">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  
  <!-- HTML Meta Tags -->
  <title>Faraday Docs</title>
  <meta name="description" content="Faraday is an HTTP client library abstraction layer that provides a common interface over many adapters (such as Net::HTTP) and embraces the concept of Rack middleware when processing the request/response cycle.">
  
  <!-- OpenGraph Meta Tags -->
  <meta property="og:url" content="https://lostisland.github.io/faraday/#/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Faraday Docs">
  <meta property="og:description" content="Faraday is an HTTP client library abstraction layer that provides a common interface over many adapters (such as Net::HTTP) and embraces the concept of Rack middleware when processing the request/response cycle.">
  <meta property="og:image" content="https://lostisland.github.io/faraday/_media/repo-card.png">
  
  <!-- Twitter Meta Tags -->
  <meta name="twitter:card" content="summary_large_image">
  <meta property="twitter:domain" content="lostisland.github.io">
  <meta property="twitter:url" content="https://lostisland.github.io/faraday/#/">
  <meta name="twitter:title" content="Faraday Docs">
  <meta name="twitter:description" content="Faraday is an HTTP client library abstraction layer that provides a common interface over many adapters (such as Net::HTTP) and embraces the concept of Rack middleware when processing the request/response cycle.">
  <meta name="twitter:image" content="https://lostisland.github.io/faraday/_media/repo-card.png">
  
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/docsify-darklight-theme@3.2.0/dist/style.min.css"
    integrity="sha384-8UgVH/UVTe7r3Lidxa5o+UOdPR98CbqYVTYMwQ88K7JgANe1AZOq4AUIhrh5ipyI"
    crossorigin="anonymous"
    title="docsify-darklight-theme"
    type="text/css"
  />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/prism-themes@1.9.0/themes/prism-one-light.min.css"
    integrity="sha384-wfpYO27rpeJ2ZOVwfG6TuU4ahxLdxLmGXK/BiSH98jJye0CNNWTOM+kA8rP8Yg4p"
    crossorigin="anonymous"
    id="prism-theme"
    type="text/css"
  />
</head>
<body>
  <div id="app"></div>
  <!-- Docsify plugins -->
  <script
    src="https://cdn.jsdelivr.net/npm/docsify-edit-on-github@1.0.3/index.js"
    integrity="sha384-Ogj2j37/GYQ910jiWc156XK1kUoZ8G5Tk2FYk1rA9wwYRnozI9Em5LU9fjzgJyPS"
    crossorigin="anonymous">
  </script>

  <!-- Docsify config -->
  <script>
    window.$docsify = {
      name: 'Faraday',
      repo: 'lostisland/faraday',
      logo: '_media/home-logo.svg',
      homepage: 'index.md',
      search: true,
      loadSidebar: true,
      subMaxLevel: 4,
      auto2top: true,
      darklightTheme: {
        dark: {
          accent: '#EE4266',
          prismTheme: 'prism-one-dark',
          toogleImage: 'url(https://cdn.jsdelivr.net/npm/docsify-darklight-theme@3.2.0/icons/sun.svg)'
        },
        light: {
          accent: '#EE4266',
          prismTheme: 'prism-one-light',
          toogleImage: 'url(https://cdn.jsdelivr.net/npm/docsify-darklight-theme@3.2.0/icons/moon.svg)'
        }
      },
      plugins: [
        EditOnGithubPlugin.create(
          'https://github.com/lostisland/faraday/blob/main/docs/',
          null,
          'Edit this page on GitHub'
        ),
        function pageFooter(hook, _vm) {
          var footer = [
            '<hr/>',
            '<footer>',
            '<span>© 2009 - 2026, the Faraday Team. </span>',
            '<span>Website and branding design by <a href="https://elelopic.design" target="_blank" rel="noopener">Elena Lo Piccolo</a>.</span>',
            '</footer>',
          ].join('');

          hook.afterEach(function (html) {
            return html + footer;
          });
        },
        function prismThemeSwitcher(hook, _vm) {
          // Switch Prism theme based on docsify-darklight-theme setting
          let themes = {
            light: {
              href: 'https://cdn.jsdelivr.net/npm/prism-themes@1.9.0/themes/prism-one-light.min.css',
              integrity: 'sha384-wfpYO27rpeJ2ZOVwfG6TuU4ahxLdxLmGXK/BiSH98jJye0CNNWTOM+kA8rP8Yg4p'
            },
            dark: {
              href: 'https://cdn.jsdelivr.net/npm/prism-themes@1.9.0/themes/prism-one-dark.min.css',
              integrity: 'sha384-v9GL8Hq3ahE75oFR1DFNlW6Um5pHhFd4zZ1GhlseYYdm7vQJnxZo27sXBkHLcv3O'
            }
          };

          let switchTheme = () => {
            console.log('Theme changed');
            let theme = localStorage.getItem('DARK_LIGHT_THEME')
            let link = document.getElementById('prism-theme');
            let selectedTheme = theme === 'dark' ? themes.dark : themes.light;
            link.setAttribute('integrity', selectedTheme.integrity);
            link.setAttribute('href', selectedTheme.href);
          }

          hook.ready(() => {
            document.getElementById('main').addEventListener('click', switchTheme);
            switchTheme();
          });
        },
      ]
    }
  </script>
  <!-- Docsify v4 -->
  <script
    src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/docsify.min.js"
    integrity="sha384-KaHhgnx/OTLoJ4J33SSJsF4x1pk4I7q3s5ZOfIDHJYl6IG7Oyn2vNDsHiWJe46fD"
    crossorigin="anonymous">
  </script>
  <!-- Docsify Darklight Theme -->
  <script
    src="https://cdn.jsdelivr.net/npm/docsify-darklight-theme@3.2.0/dist/index.min.js"
    integrity="sha384-P4geLkdzz6Hc6jp+0sQB8fyDUZsv9rBMvV19RuUCoutEbOP13irUpZvAkcVzMYBJ"
    crossorigin="anonymous"
    type="text/javascript">
  </script>
  <!-- Prism Ruby highlight -->
  <script
    src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-ruby.min.js"
    integrity="sha384-xVcnao4LK2LGPWtbEMXzbqrmtM8Ycfrz6nH7gthLCLwCrQGhNFScUV7UGjDotjVu"
    crossorigin="anonymous">
  </script>
  <script
    src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-bash.min.js"
    integrity="sha384-9WmlN8ABpoFSSHvBGGjhvB3E/D8UkNB9HpLJjBQFC2VSQsM1odiQDv4NbEo+7l15"
    crossorigin="anonymous">
  </script>

  <!-- Other Plugins -->
  <script
    src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/search.min.js"
    integrity="sha384-LthJPBJ4RGco78kBY+EmKz5rmISZ5vrtAu3+l2ALQ2mrZHOe6Wyf6knyKjeC4cL6"
    crossorigin="anonymous">
  </script>
  <script
    src="https://cdn.jsdelivr.net/npm/docsify-copy-code@3.0.2/dist/docsify-copy-code.min.js"
    integrity="sha384-xvU4Qmx14Fe/3hDKuOUUQ8eOzoa7OVTL0vp3amTSv2KY8lCjlrga7DoqecFFOT7j"
    crossorigin="anonymous">
  </script>
</body>
</html>
