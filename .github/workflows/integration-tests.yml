name: Integration Tests

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read # to fetch code (actions/checkout)

jobs:
  integration:
    runs-on: ubuntu-latest

    # Run job in container for simplified networking with service containers
    container:
      image: ruby:3.4
      options: --user root

    # Service containers to run alongside the job
    services:
      httpbin:
        image: kennethreitz/httpbin:latest

      # Future: Proxy server for proxy tests
      # Uncomment when implementing ProxyOptions integration tests (Task 5)
      # proxy:
      #   image: ubuntu/squid:latest
      #   options: >-
      #     --health-cmd "nc -z localhost 3128 || exit 1"
      #     --health-interval 5s
      #     --health-timeout 3s
      #     --health-retries 10
      #     --health-start-period 5s

    steps:
      - uses: actions/checkout@v5

      # Container jobs need git installed for checkout to work properly
      - name: Install system dependencies
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git

      # Install dependencies
      # Note: ruby:3.4 container already has Ruby and bundler installed
      # We skip ruby/setup-ruby because it requires Node.js (not in ruby image)
      # and is unnecessary when running in a Ruby container
      - name: Install dependencies
        run: bundle install --jobs 4 --retry 3

      # Verify services are accessible
      - name: Verify services
        run: |
          echo "Waiting for httpbin to be ready..."
          # Give httpbin a moment to start up (Python app takes longer than Go)
          attempt=1
          max_attempts=30
          while [ $attempt -le $max_attempts ]; do
            if curl -sf http://httpbin/get > /dev/null 2>&1; then
              echo "✓ httpbin is ready (attempt $attempt/$max_attempts)"
              exit 0
            fi
            echo "Attempt $attempt/$max_attempts: httpbin not ready yet, waiting..."
            sleep 2
            attempt=$((attempt + 1))
          done
          echo "✗ httpbin failed to become ready after $max_attempts attempts"
          exit 1

      - name: Run integration tests
        run: bundle exec rspec spec/integration --format documentation
        env:
          # Service URLs for integration tests
          # Note: kennethreitz/httpbin runs on port 80 (default HTTP)
          HTTPBIN_URL: http://httpbin
          # PROXY_URL: http://proxy:3128  # Uncomment when proxy tests are added
          # Disable SimpleCov for integration tests
          # Integration tests exercise real HTTP behavior, not lib/ code coverage
          COVERAGE: 'false'
